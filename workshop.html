<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11191d"><title>Deadlight · Character & weapon preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10181c;color:#e7ecec;font:15px system-ui,sans-serif}main{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(18px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));gap:16px}header{display:flex;justify-content:space-between;align-items:center;gap:18px}h1{font-size:18px;letter-spacing:.08em;margin:5px 0}small,p{color:#9facaf}a{color:#b8ede2;text-decoration:none}#stage{position:relative;min-height:240px;border:1px solid #304047;border-radius:16px;overflow:hidden;background:#182329}canvas{width:100%;height:100%;display:block;touch-action:none}#status{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;background:#182329}#status[hidden]{display:none}#caption{position:absolute;bottom:10px;left:16px;right:16px;pointer-events:none;font-size:12px;color:#a9b9bb}footer{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;gap:7px;font-size:12px;color:#a9b9bb}select,button{font:inherit;background:#203036;color:#ecf6f3;border:1px solid #455c62;border-radius:8px;padding:11px;min-height:44px}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #83ebd1;outline-offset:3px}#scrub{min-width:150px;accent-color:#83ebd1}#poseControls{display:contents}.hidden{display:none!important}.spacer{flex:1}#title{font-size:24px;letter-spacing:.02em}@media(max-width:650px){main{gap:10px;padding:12px}header small{display:none}#title{font-size:18px}footer{gap:9px}select,button{padding:9px}#stage{min-height:200px}#scrub{width:115px;min-width:0}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head><body><main>
<header><div><small>DEADLIGHT / ASSET PREVIEW</small><h1 id="title">Characters & weapons</h1></div><a href="./">← Back to game</a></header>
<section id="stage" aria-label="Interactive 3D asset preview"><canvas id="viewer" aria-label="Drag to rotate; pinch or scroll to zoom"></canvas><div id="status" role="status">Opening the workshop…</div><p id="caption">Drag to rotate · pinch or scroll to zoom</p></section>
<footer>
<label>Asset<select id="asset"><option value="caretaker">Caretaker zombie</option><option value="zombie_original">Original zombie</option><option value="sidearm">M-11 Sidearm</option><option value="viper">Viper SMG</option><option value="breacher">Breacher 12G</option><option value="sentinel">Sentinel DMR</option><option value="warden">Warden LMG</option><option value="arc9">ARC-9 Pulse</option><option value="mauler">Mauler Auto-12</option><option value="longbow">Longbow .338</option><option value="nova">Nova Lance</option></select></label>
<div id="poseControls"><label>Appearance<select id="look"><option value="0">Scavenger</option><option value="1">Drifter</option><option value="2">Worker</option><option value="original">Original texture</option></select></label><label id="versionControl">Motion<select id="version"><option value="refined">Refined</option><option value="original">Original</option></select></label><label>Pose<select id="clip"></select></label><button id="play" type="button" aria-pressed="false">Pause</button><label>Timeline<input id="scrub" type="range" min="0" max="1" step="0.001" value="0"></label><label>Speed<select id="speed"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option></select></label></div>
</footer></main><script type="module" src="./workshop.js"></script></body></html>
